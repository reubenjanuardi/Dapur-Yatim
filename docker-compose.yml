version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dapur_yatim_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dapur_yatim_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dapur_yatim_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dapur_yatim_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dapur_yatim_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: http://localhost,http://localhost:80
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ports:
      - '3001:3001'
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - dapur_yatim_net

  # ─── Frontend (served with nginx) ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api/v1
    container_name: dapur_yatim_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
    networks:
      - dapur_yatim_net

volumes:
  postgres_data:

networks:
  dapur_yatim_net:
    driver: bridge
